# SAAF Sentinel configuration. Findings: docs/sentinel-findings.md
[sentinel]
# "never": report only, never block a pull request. Switch to "error" once the
# findings are fixed.
fail-on = "never"

[static]
# tools/clause_sources are offline maintenance scripts; sentinel/ is the checker itself
exclude = ["tools", "sentinel"]

[contract]
adapter = "sentinel_adapter.py"
